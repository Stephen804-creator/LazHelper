# Render Blueprint for Laz Helper.
services:
  - type: web
    name: laz-helper
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LAZ_HELPER_ALLOWED_ROOT
        value: ./workspace
      - key: LAZ_HELPER_MAX_FILES
        value: "1500"
      - key: LAZ_HELPER_MAX_DEPTH
        value: "8"
      - key: LAZ_HELPER_MAX_FILE_MB
        value: "20"
      - key: LAZ_HELPER_MAX_TEXT_CHARS
        value: "18000"
      - key: LAZ_HELPER_OLLAMA_URL
        value: http://127.0.0.1:11434
      - key: LAZ_HELPER_OLLAMA_MODEL
        value: gemma3:1b
      - key: LAZ_HELPER_AI_TIMEOUT_SECONDS
        value: "45"
