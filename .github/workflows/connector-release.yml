name: Build Laz Connector releases

on:
  pull_request:
  push:
    tags:
      - "connector-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} connector
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: laz-connector-windows
            executable: dist/laz-connector.exe
          - os: macos-latest
            artifact: laz-connector-macos
            executable: dist/laz-connector
          - os: ubuntu-latest
            artifact: laz-connector-linux
            executable: dist/laz-connector
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install connector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r connector/requirements.txt pyinstaller
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name laz-connector --paths . laz_connector/__main__.py
      - name: Smoke-test standalone executable
        shell: bash
        run: ./"${{ matrix.executable }}" --version
      - name: Package executable and checksum
        shell: bash
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" "package/$(basename "${{ matrix.executable }}")"
          cp connector/README.md package/README.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          package = Path("package")
          executable = next(p for p in package.iterdir() if p.name != "README.txt")
          digest = hashlib.sha256(executable.read_bytes()).hexdigest()
          (package / "SHA256SUMS.txt").write_text(f"{digest}  {executable.name}\n", encoding="utf-8")
          PY
          cd package
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" *
          else
            zip -r "../${{ matrix.artifact }}.zip" *
          fi
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/connector-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
