name: Laz Helper tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: |
          node --check static/device-connect.js
          node --check static/downloads-page.js
          node --check static/stage-n.js
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
