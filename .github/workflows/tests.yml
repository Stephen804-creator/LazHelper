name: LazHelper tests
on:
  pull_request:
  push:
    branches: [main, "build/units-1-5"]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lazhelper
          POSTGRES_PASSWORD: lazhelper_test_password
          POSTGRES_DB: lazhelper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lazhelper -d lazhelper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lazhelper:lazhelper_test_password@localhost:5432/lazhelper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Check browser JavaScript syntax
        run: |
          node --check static/device-connect.js
          node --check static/downloads-page.js
          node --check static/stage-n.js
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://lazhelper:lazhelper_test_password@localhost:5432/lazhelper_test
