<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Laz Helper understands your files and helps you organise them. Nothing moves until you approve it.">
<meta name="theme-color" content="#244a38">
<title>Laz Helper</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">
  <header class="top"><span class="logo" aria-hidden="true">L</span><b>Laz Helper</b></header>
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">L</span><div><b>Laz Helper</b><small>Understand your files</small></div></div>
    <nav id="nav" aria-label="Main">
      <button data-v="home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>Home</span></button>
      <button data-v="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Review</span></button>
      <button data-v="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2"/></svg><span>History</span></button>
      <button data-v="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></button>
    </nav>
    <p class="side-note">Your files stay on your computer. Nothing moves until you approve it.</p>
  </aside>
  <main id="main">
    <section id="v-home" class="view on"></section>
    <section id="v-review" class="view"></section>
    <section id="v-history" class="view"></section>
    <section id="v-settings" class="view"></section>
    <noscript><p class="card">Laz Helper needs JavaScript to run in your browser.</p></noscript>
  </main>
</div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="File details"><div id="panel" class="panel"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
